# ============================================================================
# Xtrim — local infrastructure stack
#
#   docker compose up -d                     -> PostgreSQL + Redis
#   docker compose --profile kafka up -d     -> ... and Kafka (KRaft, no ZooKeeper)
#
# Every image is pinned by tag: `:latest` is banned (requirement D4).
# Every host port is bound to 127.0.0.1 so nothing leaks to the local network.
# Credentials come from the root `.env` — this file never contains a password.
# ============================================================================

name: xtrim

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xtrim}
      POSTGRES_USER: ${POSTGRES_USER:-xtrim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-xtrim}" -d "${POSTGRES_DB:-xtrim}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Kafka is infrastructure only: no use case depends on it (tech-stack 2.6).
  # It stays behind a profile so a Kafka failure can never block a local start.
  kafka:
    image: apache/kafka:4.2.1
    profiles: ["kafka"]
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ==========================================================================
  # The product — one command on any host with Docker:
  #
  #   docker compose --profile app up -d --build --wait
  #   scripts/stack.sh up            (the same, with a smoke test beside it)
  #
  # The app services do NOT read `.env` as an `env_file`: those values are
  # host values (SERVER_PORT is the published port, the datasource says
  # localhost). Inside the network the API listens on 8080 and reaches the
  # database at postgres:5432, so the environment is written explicitly here.
  # ==========================================================================

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    image: xtrim-api:local
    init: true
    environment:
      # The container port, never the host one from .env.
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xtrim}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-xtrim}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-4200},http://127.0.0.1:${WEB_PORT:-4200}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — generate one with openssl rand -base64 48}
      JWT_TTL: ${JWT_TTL:-3600}
    ports:
      # The host port comes from .env; the container port is fixed.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 45s
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    image: xtrim-site:local
    init: true
    environment:
      # The internal address: SSR, the /api proxy and the sitemap use it.
      PUBLIC_API_URL: http://backend:8080/api
      # The public address: canonical links, Open Graph and the sitemap.
      SITE_BASE_URL: http://localhost:${WEB_PORT:-4200}
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:4000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
