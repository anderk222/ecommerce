spring.application.name=ecommerce

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB:mydatabase}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server.port=${SERVER_PORT:${PORT:8080}}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=xtrim:
spring.cache.redis.use-key-prefix=true

app.security.jwt-secret=${JWT_SECRET:CHANGE_ME_replace_with_a_random_secret_of_at_least_32_bytes}
app.security.jwt-ttl=${JWT_TTL:3600}
